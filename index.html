<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <section class="header__container">
            <a href=""><img src="./img/logo.png" alt="logo" ></a>

            <nav class="header__nav">
                <ul>
                    <li><a href="">Главная</a></li>
                    <li><a href="">Номера</a></li>
                    <li><a href="">Услуги</a></li>
                    <li><a href="">О нас</a></li>
                    <li><a href="">Контакты</a></li>
                </ul>
            </nav>

            <div class="header__reservation">
                <a href=""><img src="./img/header_tell.png" alt=""> +7 995  383  16   16</a>
                <button>Забронировать</button>
            </div>
        </section>
    </header>

    <main>

        <section class="slider">
            <div class="slider__container">
                <div class="slide__btnleft"><button><img src="./img/arrow-left.png" alt=""></button></div>
                <div class="slide__inf">
                    <div>
                        <h1>Глэмпинг в Казани</h1>
                        <p>на холмистых склонах в окружении соснового бора <br> с красивым голубым небом</p>
                    </div>
                    <button>Забронировать домик <img src="./img/928424_annual_appointment_calendar_day_month_icon1.png" alt=""></button>
                </div>
                <div class="slide__btnright"><button><img src="./img/arrow-right.png" alt=""></button></div>
            </div>
        </section>

        <section class="booking">
            <div class="booking__container">
                <div class="booking__container__forelement">
                <h2 class="booking__h2">Забронировать домик</h2>

                <form action="" class="booking__form">
                    <div class="form__group">
                        <label for="" class="form__label">Заезд</label>
                        <div class="input__wrapper">
                            <input type="data" class="form__input" placeholder="22.10.2023">
                            <img class="input__icon" src="./img/calendar_day_month_icon1.png" alt="">
                        </div>
                    </div>

                    <div class="form__group">
                        <label for="" class="form__label">выезд</label>
                        <div class="input__wrapper">
                            <input type="data" class="form__input" placeholder="23.10.2023">
                            <img class="input__icon" src="./img/calendar_day_month_icon1.png" alt="">
                        </div>
                    </div>

                    <div class="form__group">
                        <label for="" class="form__label">количество гостей</label>
                        <div class="input__wrapper">
                            <input type="number" class="form__input" placeholder="2 взрослых, 0 детей">
                            <img class="input__icon" src="./img/user.png" alt="">
                        </div>
                    </div>

                    <button class="booking__btn">Забронировать</button>
                </form>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
